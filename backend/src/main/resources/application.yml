spring:
  application:
    name: diy-bracelet-mall-backend
  servlet:
    multipart:
      # 传输层略高于业务 5 MB 边界，精确限制由 FileStorage 统一返回业务错误。
      max-file-size: 6MB
      max-request-size: 6MB
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:diy_bracelet}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:diy_bracelet}
    password: ${MYSQL_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  orders:
    # 新建订单使用此期限；历史待支付单由 V18 统一给予 30 分钟宽限。
    payment-timeout: ${ORDER_PAYMENT_TIMEOUT:PT30M}
    expiry-scan-delay: ${ORDER_EXPIRY_SCAN_DELAY:PT30S}
    expiry-enabled: ${ORDER_EXPIRY_ENABLED:true}
  ai:
    encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:}
    # 单进程最多同时调用的模型请求数；超限立即返回，避免慢上游挤占业务线程。
    max-concurrent-requests: ${AI_MAX_CONCURRENT_REQUESTS:4}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:Admin@123}
    jwt-secret: ${JWT_SECRET:local-development-only-secret-change-me-32-bytes}
    jwt-ttl: ${JWT_TTL:PT8H}
    jwt-issuer: ${JWT_ISSUER:diy-bracelet-mall}
  customer-auth:
    jwt-secret: ${CUSTOMER_JWT_SECRET:local-customer-secret-change-me-32-bytes}
    jwt-ttl: ${CUSTOMER_JWT_TTL:P30D}
    jwt-issuer: ${CUSTOMER_JWT_ISSUER:diy-bracelet-customer}
    identity-pepper: ${CUSTOMER_IDENTITY_PEPPER:local-identity-pepper-change-me-32-bytes}
  file-storage:
    max-size-bytes: ${FILE_STORAGE_MAX_SIZE_BYTES:5000000}
    local:
      root: ${FILE_STORAGE_LOCAL_ROOT:storage/catalog}

server:
  # 演示身份和支付仅供本地使用；真机联调需显式指定受信任局域网地址。
  address: ${BACKEND_ADDRESS:127.0.0.1}
  port: ${BACKEND_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
