spring:
  application:
    name: diy-bracelet-mall-backend
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:diy_bracelet}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${MYSQL_USER:diy_bracelet}
    password: ${MYSQL_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true

app:
  ai:
    encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  auth:
    admin:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:Admin@123}
    jwt-secret: ${JWT_SECRET:local-development-only-secret-change-me-32-bytes}
    jwt-ttl: ${JWT_TTL:PT8H}
    jwt-issuer: ${JWT_ISSUER:diy-bracelet-mall}
  customer-auth:
    jwt-secret: ${CUSTOMER_JWT_SECRET:local-customer-secret-change-me-32-bytes}
    jwt-ttl: ${CUSTOMER_JWT_TTL:P30D}
    jwt-issuer: ${CUSTOMER_JWT_ISSUER:diy-bracelet-customer}
    identity-pepper: ${CUSTOMER_IDENTITY_PEPPER:local-identity-pepper-change-me-32-bytes}
  file-storage:
    max-size-bytes: ${FILE_STORAGE_MAX_SIZE_BYTES:5242880}
    local:
      root: ${FILE_STORAGE_LOCAL_ROOT:storage/catalog}

server:
  port: ${BACKEND_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
